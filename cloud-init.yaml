#cloud-config
users:
  - name: slimstream
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAwCSauodhkxY+fL0bI1k9uPvtGksToFEi4hFNiqYMSz slimstream-deploy

package_update: true
package_upgrade: true

packages:
  - ffmpeg
  - imagemagick
  - libheif-examples   # gives heif-convert, for A4 (Pixel HEIC handling)
  - python3
  - python3-pip
  - python3-venv
  - sqlite3
  - git
  - ufw

write_files:
  - path: /etc/ssh/sshd_config.d/99-slimstream.conf
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no

runcmd:
  - systemctl restart sshd
  - ufw allow OpenSSH
  - ufw --force enable
  # MEGAcmd isn't in Ubuntu's default repos - install from MEGA's own package
  - wget -q -O /tmp/megacmd.deb https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb
  - apt-get install -y /tmp/megacmd.deb
  - rm /tmp/megacmd.deb