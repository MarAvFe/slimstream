[project]
name = "slimstream"
version = "0.1.0"
description = "Automated media compression pipeline: Mega source of truth, manifest-driven, reversible."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
slimstream = "slimstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
